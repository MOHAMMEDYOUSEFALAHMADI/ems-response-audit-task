[project]
name = "ems-response-audit-task"
version = "0.1.0"
description = "Multi-bug software-engineering eval task for coding agents: synthetic ambulance dispatch analytics"
license = {text = "MIT"}
authors = [{name = "Mohammed Alahmadi"}]
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E741", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"**/generate.py" = ["E501"]
"**/test_*.py" = ["E501"]
